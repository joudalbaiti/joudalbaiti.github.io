<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BAZ Racing · Face Match</title>

<!-- Stand-ins for Lama Sans. If the client sends the Lama Sans files, they win automatically (see --f-* below). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,700&family=Readex+Pro:wght@300;400;600&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">

<style>
  :root{
    /* BAZ Racing palette (brand guidelines, section 5) */
    --java:#279896;        /* primary */
    --navy:#102452;        /* primary */
    --java-l:#9adbd8;      /* java tint used in the triangle pattern */
    --java-d:#006b6b;      /* java shade used in the triangle pattern */
    --crimson:#991c50;     /* secondary, used for errors */
    --bg:#030a1a;          /* dark page colour from the guideline slides */
    --panel:#eef2f8;       /* light card colour from the guideline slides */
    --ink:#102452;
    --ink-2:rgba(16,36,82,.68);
    --line:rgba(16,36,82,.12);

    /* Typography (section 6): Lama Sans first, close stand-ins after */
    --f-cond:"Lama Sans Condensed","Barlow Condensed",system-ui,sans-serif;
    --f-exp:"Lama Sans Expanded","Unbounded",system-ui,sans-serif;
    --f-body:"Lama Sans","Readex Pro",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}

  .app{
    height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;
    padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right))
            max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  }

  /* ---------------- camera side ---------------- */
  .cam{border-radius:22px;background:var(--panel);padding:10px;min-width:0}
  .stage{position:relative;width:100%;height:100%;border-radius:14px;overflow:hidden;background:#000}
  video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}

  .track{position:absolute;border:3px solid var(--java);border-radius:16px;opacity:0;
         transition:opacity .25s,border-color .25s;pointer-events:none;
         box-shadow:0 0 0 4px rgba(39,152,150,.18)}
  .track.on{opacity:1}
  .track.far{border-color:rgba(255,255,255,.5);box-shadow:none}

  .scan{position:absolute;left:0;right:0;height:170px;pointer-events:none;opacity:0;
        background:linear-gradient(180deg,transparent,rgba(39,152,150,.45),transparent)}
  .scanning .scan{opacity:1;animation:sweep 1.1s linear infinite}
  @keyframes sweep{from{top:-170px}to{top:100%}}

  .hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
        padding:11px 26px;border-radius:99px;white-space:nowrap;
        font:italic 700 21px/1 var(--f-cond);letter-spacing:.02em;color:#fff;
        background:rgba(3,10,26,.62);border:1px solid rgba(255,255,255,.16);
        -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:.3s}
  .hint.hot{background:var(--java);border-color:var(--java)}

  /* ---------------- results side ---------------- */
  .panel{display:flex;flex-direction:column;background:var(--panel);border-radius:22px;
         overflow:hidden;min-height:0;min-width:0}

  /* logo: never stretched, no effects, clear space >= half its height (section 3) */
  .logo{flex:none;padding:clamp(20px,3.2vh,30px) clamp(22px,3vw,34px) 0;
        margin-bottom:clamp(20px,3.2vh,30px)}
  .logo img{height:clamp(40px,6.2vh,60px);width:auto;display:block}

  .content{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
           padding:0 clamp(22px,3vw,34px) 18px;display:flex;flex-direction:column}

  .tri{flex:none;display:block;width:100%;height:40px}

  .label{font:italic 700 clamp(18px,1.9vw,23px)/1 var(--f-cond);color:var(--java);
         letter-spacing:.02em}
  .rule{width:56px;height:4px;border-radius:4px;background:var(--java);margin:14px 0 4px}

  /* idle */
  .idle{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;
        animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
  .idle h1{margin:4px 0 0;font:800 clamp(26px,3.3vw,44px)/1.08 var(--f-exp);color:var(--navy)}
  .idle .ar{margin:0;font:600 clamp(20px,2.3vw,30px)/1.4 var(--f-body);color:var(--navy);direction:rtl;text-align:right}
  .idle p.sub{margin:0;font-size:clamp(15px,1.4vw,17px);line-height:1.6;color:var(--ink-2);max-width:40ch}

  /* busy + error */
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
          gap:16px;text-align:center}
  .ring{width:76px;height:76px;border-radius:50%;border:5px solid rgba(39,152,150,.18);
        border-top-color:var(--java);animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .busy{font:italic 700 26px/1 var(--f-cond);color:var(--navy)}
  .err{font-size:16px;line-height:1.6;color:var(--crimson);max-width:34ch}

  /* result */
  .duo{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
       gap:clamp(10px,1.6vw,18px);max-width:560px;margin-top:10px;
       animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
  .duo figure{margin:0;text-align:center}
  .duo img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;display:block;background:#dde4ee;
           border:3px solid var(--java);box-shadow:0 10px 26px rgba(39,152,150,.22)}
  .duo figcaption{margin-top:8px;font:italic 700 17px/1 var(--f-cond);letter-spacing:.04em;
                  text-transform:uppercase;color:var(--java)}

  .pct{width:clamp(76px,8.6vw,104px);aspect-ratio:1;border-radius:50%;background:var(--navy);
       color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
       box-shadow:0 0 0 6px rgba(39,152,150,.25)}
  .pct b{font:800 clamp(22px,2.5vw,30px)/1 var(--f-exp);font-variant-numeric:tabular-nums}
  .pct b i{font-style:normal;font-size:.55em;margin-left:1px;color:var(--java-l)}
  .pct small{margin-top:4px;font:italic 600 13px/1 var(--f-cond);letter-spacing:.08em;
             text-transform:uppercase;color:var(--java-l)}

  .verdict{margin-top:24px;animation:pop .5s .05s backwards}
  .name{margin:6px 0 0;font:800 clamp(24px,2.9vw,38px)/1.1 var(--f-exp);color:var(--navy);
        animation:pop .5s .08s backwards}
  .who{margin:18px 0 6px;font-size:clamp(16px,1.6vw,19px);animation:pop .5s .12s backwards}
  .caption{margin:0;font-size:clamp(15px,1.5vw,18px);line-height:1.65;color:var(--ink-2);
           max-width:48ch;white-space:pre-line;animation:pop .5s .14s backwards}

  .also{margin:22px 0 10px}
  .result{margin:auto 0}      /* centred vertically, but never clipped if it gets long */
  .row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:#fff;
       border:1px solid var(--line);margin-bottom:8px;animation:pop .45s backwards}
  .row img{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none}
  .row .meta{flex:1;min-width:0}
  .row .nm{font-weight:600;font-size:15px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .cp{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .row .pc{font:italic 700 22px/1 var(--f-cond);color:var(--java);flex:none}

  @keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  /* iPad upright: stay side by side, just tighter */
  @media (max-width:900px){
    .app{gap:10px;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right))
         max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
    .cam{padding:8px;border-radius:18px}
    .panel{border-radius:18px}
    .logo{padding:22px 22px 0;margin-bottom:22px}   /* clear space = half the logo height */
    .logo img{height:44px}
    .content{padding:0 22px 14px}
    .hint{font-size:17px;padding:9px 16px;bottom:14px}
    .idle h1{font-size:24px}
    .idle .ar{font-size:20px}
    .duo{gap:8px}
    .pct{width:64px;box-shadow:0 0 0 4px rgba(39,152,150,.25)}
    .pct b{font-size:19px}
    .pct small{font-size:10px}
    .duo figcaption{font-size:14px}
    .name{font-size:22px}
    .caption{font-size:14.5px}
  }
</style>
</head>
<body>

<div class="app">
  <section class="cam" id="cam">
    <div class="stage" id="stage">
      <video id="v" autoplay muted playsinline></video>
      <div class="track" id="track"></div>
      <div class="scan"></div>
      <div class="hint" id="hint"></div>
    </div>
  </section>

  <aside class="panel">
    <div class="logo"><img id="logo" alt="BAZ Racing"></div>
    <div class="content" id="content"></div>
    <!-- BAZ triangle pattern (iconography, section 8) -->
    <svg class="tri" aria-hidden="true">
      <defs>
        <pattern id="triP" width="48" height="40" patternUnits="userSpaceOnUse">
          <polygon points="24,0 12,12 36,12" fill="#9adbd8"/>
          <polygon points="12,12 0,24 24,24" fill="#9adbd8"/>
          <polygon points="36,12 24,24 48,24" fill="#9adbd8"/>
          <polygon points="12,27 0,40 24,40" fill="#006b6b"/>
          <polygon points="36,27 24,40 48,40" fill="#006b6b"/>
        </pattern>
      </defs>
      <rect width="100%" height="40" fill="url(#triP)"/>
    </svg>
  </aside>
</div>

<canvas id="c" hidden></canvas>

<script>
/* ============ edit the words here ============ */
const CONFIG = {
  logo:        'BLACK.png',
  label:       'Face Match',
  title:       'Find your match',
  titleAr:     'اكتشف من يشبهك',
  sub:         'Just look at the camera. It starts by itself.',
  lookLike:    'You look like',
  whoIs:       'Who is {name}?',     // {name} becomes the first name
  youLabel:    'You',
  alsoLabel:   'Also close',
  hints: {
    looking:   'Looking for a face…',
    closer:    'Come a bit closer',
    hold:      'Hold still…',
    analysing: 'Analysing…',
    next:      'Step away for the next person'
  }
};

/* ============ tuning ============ */
const POLL_MS      = 550;   // how often to check for a face
const NEAR_RATIO   = 0.22;  // face width / frame width needed to trigger
const LOCK_FRAMES  = 3;     // steady frames before analysing
const HOLD_MS      = 7000;  // minimum time a result stays up
const CLEAR_FRAMES = 3;     // empty frames before re-arming

const v = document.getElementById('v');
const c = document.getElementById('c');
const cam = document.getElementById('cam');
const stage = document.getElementById('stage');
const track = document.getElementById('track');
const hint = document.getElementById('hint');
const content = document.getElementById('content');
document.getElementById('logo').src = CONFIG.logo;

let state = 'ARMED', goodStreak = 0, emptyStreak = 0, shownAt = 0;

const esc = s => String(s ?? '').replace(/[&<>"']/g, ch =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

showIdle();
setHint(CONFIG.hints.looking, false);
start();

async function start(){
  try{
    v.srcObject = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user', width:{ideal:1280}, height:{ideal:960}}, audio:false
    });
    await v.play();
    loop();
  }catch(e){
    showError('Camera blocked. Open this page over https and allow camera access.');
  }
}

function grab(canvas, width, quality){
  if(!v.videoWidth) return null;
  canvas.width = width;
  canvas.height = Math.round(width * v.videoHeight / v.videoWidth);
  canvas.getContext('2d').drawImage(v, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', quality);
}

// The model runs on Joud's AI Lab Space (Hugging Face); this page calls its API.
const API = 'https://joudalbaiti-ai-lab.hf.space/gradio_api/call/';
async function post(url, image){
  const name = url === '/detect' ? 'baz_detect' : 'baz_match';
  const r1 = await fetch(API + name, {method:'POST', headers:{'Content-Type':'application/json'},
                                      body: JSON.stringify({data:[image]})});
  if(!r1.ok) throw new Error('HTTP ' + r1.status);
  const {event_id} = await r1.json();
  const sse = await (await fetch(API + name + '/' + event_id)).text();
  const m = sse.match(/event: complete\s*\ndata: (.*)/);
  if(!m) throw new Error('no result');
  awake = true;
  return JSON.parse(JSON.parse(m[1])[0]);
}
let awake = false;

function drawBox(box, near){
  if(!box){ track.classList.remove('on'); return; }
  const cw = stage.clientWidth, ch = stage.clientHeight;
  const s = Math.max(cw / v.videoWidth, ch / v.videoHeight);
  const dw = v.videoWidth * s, dh = v.videoHeight * s;
  const ox = (cw - dw) / 2, oy = (ch - dh) / 2;
  const w = box.w * dw, h = box.h * dh;
  track.style.left = (cw - (ox + box.x * dw + w)) + 'px';   // mirrored
  track.style.top = (oy + box.y * dh) + 'px';
  track.style.width = w + 'px';
  track.style.height = h + 'px';
  track.classList.add('on');
  track.classList.toggle('far', !near);
}

async function loop(){
  while(true){
    await new Promise(r => setTimeout(r, POLL_MS));
    if(state === 'ANALYSING') continue;

    let d;
    if(!awake && state === 'ARMED') setHint('Waking up the server… this can take up to a minute the first time', true);
    try{ d = await post('/detect', grab(c, 480, 0.6)); }catch(e){ continue; }

    if(!d.face){
      drawBox(null); goodStreak = 0; emptyStreak++;
      if(state === 'SHOWING' && emptyStreak >= CLEAR_FRAMES && Date.now() - shownAt > HOLD_MS){
        state = 'ARMED'; showIdle();
      }
      if(state === 'ARMED') setHint(CONFIG.hints.looking, false);
      continue;
    }

    emptyStreak = 0;
    const near = d.ratio >= NEAR_RATIO;
    drawBox(d.box, near);
    if(state !== 'ARMED') continue;

    if(!near){ goodStreak = 0; setHint(CONFIG.hints.closer, false); continue; }
    if(++goodStreak < LOCK_FRAMES){ setHint(CONFIG.hints.hold, true); continue; }

    goodStreak = 0;
    await analyse();
  }
}

async function analyse(){
  state = 'ANALYSING';
  cam.classList.add('scanning');
  setHint(CONFIG.hints.analysing, true);
  content.innerHTML = `<div class="center"><div class="ring"></div>
                       <div class="busy">${esc(CONFIG.hints.analysing)}</div></div>`;

  const snap = document.createElement('canvas');
  try{
    const d = await post('/match', grab(snap, 720, 0.9));
    if(d.ok) render(d, cropFace(snap, d.box));
    else showError(d.error === 'empty_gallery'
      ? 'The gallery is empty. Run build_gallery.py first.'
      : "Couldn't read that face. Try facing the light.");
  }catch(e){
    showError('Server not reachable. Try again in a moment.');
  }

  cam.classList.remove('scanning');
  setHint(CONFIG.hints.next, false);
  shownAt = Date.now();
  state = 'SHOWING';
}

// square crop of the visitor's face, mirrored to match what they saw on screen
function cropFace(cv, box){
  const W = cv.width, H = cv.height;
  const cx = (box.x + box.w / 2) * W, cy = (box.y + box.h / 2) * H;
  let half = Math.max(box.w * W, box.h * H) * 0.85;
  half = Math.max(1, Math.min(half, cx, cy, W - cx, H - cy));
  const o = document.createElement('canvas');
  o.width = o.height = 384;
  const g = o.getContext('2d');
  g.translate(384, 0); g.scale(-1, 1);
  g.drawImage(cv, cx - half, cy - half, half * 2, half * 2, 0, 0, 384, 384);
  return o.toDataURL('image/jpeg', 0.9);
}

function setHint(text, hot){ hint.textContent = text; hint.classList.toggle('hot', !!hot); }

function showIdle(){
  content.innerHTML = `
    <div class="idle">
      <div class="label">${esc(CONFIG.label)}</div>
      <h1>${esc(CONFIG.title)}</h1>
      <p class="ar">${esc(CONFIG.titleAr)}</p>
      <div class="rule"></div>
      <p class="sub">${esc(CONFIG.sub)}</p>
    </div>`;
}

function showError(msg){
  content.innerHTML = `<div class="center"><p class="err">${esc(msg)}</p></div>`;
}

function render(d, meURL){
  const t = d.top[0];
  const first = String(t.name).trim().split(/\s+/)[0];
  let html = `<div class="result">
    <div class="duo">
      <figure class="me"><img src="${meURL}" alt=""><figcaption>${esc(CONFIG.youLabel)}</figcaption></figure>
      <div class="pct"><b><span id="num">0</span><i>%</i></b><small>match</small></div>
      <figure class="them"><img src="${esc(t.thumb)}" alt=""><figcaption>${esc(first)}</figcaption></figure>
    </div>
    <div class="label verdict">${esc(CONFIG.lookLike)}</div>
    <h2 class="name" dir="auto">${esc(t.name)}</h2>
    ${t.caption ? `
      <div class="label who">${esc(CONFIG.whoIs.replace('{name}', first))}</div>
      <p class="caption" dir="auto">${esc(t.caption)}</p>` : ''}`;

  const rest = [];   // "Also close" list turned off
  if(rest.length){
    html += `<div class="label also">${esc(CONFIG.alsoLabel)}</div>`;
    rest.forEach((m, i) => {
      html += `
      <div class="row" style="animation-delay:${0.2 + i * 0.08}s">
        <img src="${esc(m.thumb)}" alt="">
        <div class="meta">
          <div class="nm" dir="auto">${esc(m.name)}</div>
          ${m.caption ? `<div class="cp" dir="auto">${esc(m.caption)}</div>` : ''}
        </div>
        <div class="pc">${Math.round(m.score)}%</div>
      </div>`;
    });
  }

  content.innerHTML = html + '</div>';
  content.scrollTop = 0;
  countUp(document.getElementById('num'), Math.round(t.score));
}

function countUp(el, to){
  const t0 = performance.now(), dur = 1100;
  (function step(now){
    const k = Math.min(1, (now - t0) / dur);
    el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
    if(k < 1) requestAnimationFrame(step);
  })(t0);
}
</script>
</body>
</html>
